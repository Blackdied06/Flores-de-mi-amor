<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>disculpa mi amor</title>
    <audio autoplay src="img/"></audio>
    <style>
        /* Estilos generales */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: contain;
            background-position: left;
            transition: background-image 0.5s ease-in-out;
        }
        h1 {
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px black;
        }

        /* Contenedor de botones */
        .container {
            text-align: center;
        }

        /* Estilos de los botones */
        .btn {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            color: white;
            background-color: #007BFF;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: aliceblue;">Elige mi amor cual quieres mi vida</h1>
        <!-- Botones que redirigen a dos páginas diferentes -->
        <button class="btn" onclick="window.location.href='index.html'">Flores Amarillas</button>
        <button class="btn" onclick="window.location.href='index2.html'">Primeras Flores</button>
        <button class="btn" onclick="window.location.href='Galeria.html'">Galería de arte</button>


        <br><br><br><br>
        <h1 style="color: aliceblue;">Te amo mi amor </h1>
    </div>

    <script>
        // Arreglo con las rutas relativas de las imágenes
        const backgrounds = [
            new URL("img/1.jpg", window.location.href).href,  // Imagen 1
            new URL("img/2.jpg", window.location.href).href,  // Imagen 2
            new URL("img/3.jpg", window.location.href).href,  // Imagen 3
            new URL("img/4.jpg", window.location.href).href,  // Imagen 4
            new URL("img/5.jpg", window.location.href).href,  // Imagen 5
            new URL("img/6.jpg", window.location.href).href,  // Imagen 6
            new URL("img/7.jpg", window.location.href).href,  // Imagen 7
            new URL("img/8.jpg", window.location.href).href   // Imagen 8
        ];
    
        let currentBackground = 0;
    
        // Cambia la imagen de fondo cada 1 segundo
        setInterval(() => {
            currentBackground = (currentBackground + 1) % backgrounds.length; 
            document.body.style.backgroundImage = `url('${backgrounds[currentBackground]}')`;
        }, 1000);
    </script>
    
</body>
</html>
