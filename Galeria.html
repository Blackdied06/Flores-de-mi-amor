<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title style="color: rgb(34, 144, 241);">Galería del Amor de Mi Vida</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000000; /* Fondo de la página */
            color: black;
        }
        .btn {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            color: white;
            background-color: #007BFF;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        h1 {
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px black;
        }

        .carousel {
            width: 90%; /* Ancho del carrusel */
            max-width: 500px; /* Tamaño máximo del carrusel */
            overflow: hidden; /* Oculta las imágenes que salen del contenedor */
            position: relative;
            border-radius: 10px; /* Esquinas redondeadas */
            box-shadow: 0 0 15px rgba(0,0,0,0.5); /* Sombra alrededor del carrusel */
            background: linear-gradient(135deg, #ff51f6 0%, #2d83fc 100%); /* Fondo degradado del carrusel */
            margin-bottom: 20px;
        }

        .slides {
            display: flex;
            transition: transform 2s ease; /* Animación de transición */
            width: 100%;
        }

        .slide {
            min-width: 100%; /* Cada imagen ocupa el 100% del ancho del carrusel */
            height: 500px; /* Ajusta la altura del carrusel */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide img {
            max-width: 100%; /* Limita el ancho máximo de la imagen */
            max-height: 100%; /* Limita la altura máxima de la imagen */
            object-fit: contain; /* Ajusta la imagen para que se mantenga en proporción */
            border-radius: 10px; /* Esquinas redondeadas en las imágenes */
        }

        /* Efecto de sombra cuando la imagen se está mostrando */
        .slide img:hover {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
            transform: scale(1.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

    </style>
</head>
<body>
    <audio id="musicaFlores" autoplay loop preload="auto">
        <source src="audio/flores-amarillas.m4a" type="audio/mp4">
    </audio>

    <h1 style="color: aliceblue;">Galería del Amor de Mi Vida</h1>

    <div class="carousel">
        <div class="slides">
            <!-- Rutas de las imágenes del 1 al 32 -->
            <div class="slide"><img src="img/1.jpg" alt="Imagen 1"></div>
            <div class="slide"><img src="img/2.jpg" alt="Imagen 2"></div>
            <div class="slide"><img src="img/3.jpg" alt="Imagen 3"></div>
            <div class="slide"><img src="img/4.jpg" alt="Imagen 4"></div>
            <div class="slide"><img src="img/5.jpg" alt="Imagen 5"></div>
            <div class="slide"><img src="img/6.jpg" alt="Imagen 6"></div>
            <div class="slide"><img src="img/7.jpg" alt="Imagen 7"></div>
            <div class="slide"><img src="img/8.jpg" alt="Imagen 8"></div>
            <div class="slide"><img src="img/9.jpg" alt="Imagen 9"></div>
            <div class="slide"><img src="img/10.jpg" alt="Imagen 10"></div>
            <div class="slide"><img src="img/11.jpg" alt="Imagen 11"></div>
            <div class="slide"><img src="img/12.jpg" alt="Imagen 12"></div>
            <div class="slide"><img src="img/13.jpg" alt="Imagen 13"></div>
            <div class="slide"><img src="img/14.jpg" alt="Imagen 14"></div>
            <div class="slide"><img src="img/15.jpg" alt="Imagen 15"></div>
            <div class="slide"><img src="img/16.jpg" alt="Imagen 16"></div>
            <div class="slide"><img src="img/17.jpg" alt="Imagen 17"></div>
            <div class="slide"><img src="img/18.jpg" alt="Imagen 18"></div>
            <div class="slide"><img src="img/19.jpg" alt="Imagen 19"></div>
            <div class="slide"><img src="img/20.jpg" alt="Imagen 20"></div>
            <div class="slide"><img src="img/21.jpg" alt="Imagen 21"></div>
            <div class="slide"><img src="img/22.jpg" alt="Imagen 22"></div>
            <div class="slide"><img src="img/23.jpg" alt="Imagen 23"></div>
            <div class="slide"><img src="img/24.jpg" alt="Imagen 24"></div>
            <div class="slide"><img src="img/25.jpg" alt="Imagen 25"></div>
            <div class="slide"><img src="img/26.jpg" alt="Imagen 26"></div>
            <div class="slide"><img src="img/27.jpg" alt="Imagen 27"></div>
            <div class="slide"><img src="img/28.jpg" alt="Imagen 28"></div>
            <div class="slide"><img src="img/29.jpg" alt="Imagen 29"></div>
            <div class="slide"><img src="img/30.jpg" alt="Imagen 30"></div>
            <div class="slide"><img src="img/31.jpg" alt="Imagen 31"></div>
            <div class="slide"><img src="img/32.jpg" alt="Imagen 32"></div>
        </div>
    </div>
    <button class="btn" onclick="window.location.href='inicio.html'">Regresar</button>

    <script>
        let currentIndex = 0;
        const slides = document.querySelector('.slides');
        const totalSlides = document.querySelectorAll('.slide').length;

        function showNextSlide() {
            currentIndex = (currentIndex + 1) % totalSlides;
            slides.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        // Cambiar de imagen cada 3 segundos
        setInterval(showNextSlide, 3000);
    </script>
    <script src="Js/musica.js"></script>

</body>
</html>
