<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramo de Flores Animadas</title>
  <style>
    body {
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }

    .ramo {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      flex-wrap: wrap;
    }

    .flor {
      margin: 20px;
      position: relative;
      animation: florecer 2s ease-in-out forwards;
    }

    /* Animación de florecer */
    @keyframes florecer {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Movimiento de la flor de lado a lado */
    @keyframes moverLadoALado {
      0% {
        transform: translateX(0);
      }
      50% {
        transform: translateX(10px);
      }
      100% {
        transform: translateX(0);
      }
    }

    /* Estilos generales para los tallos */
    .tallo {
      position: absolute;
      bottom: -30px;
      width: 5px;
      height: 80px;
      background-color: #228B22;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Estilo para la rosa */
    .rosa {
      position: relative;
      width: 60px;
      height: 60px;
      background-color: #ff007f;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
      animation: moverLadoALado 3s ease-in-out infinite;
    }

    .rosa .petalo {
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: #ff4b88;
      border-radius: 50%;
      opacity: 0.9;
    }

    .rosa .petalo1 {
      top: -10px;
      left: 10px;
      transform: rotate(-45deg);
    }

    .rosa .petalo2 {
      top: -10px;
      right: 10px;
      transform: rotate(45deg);
    }

    .rosa .petalo3 {
      bottom: -10px;
      left: 10px;
      transform: rotate(135deg);
    }

    .rosa .petalo4 {
      bottom: -10px;
      right: 10px;
      transform: rotate(-135deg);
    }

    /* Estilo para el girasol */
    .girasol {
      position: relative;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #ffdf00, #ff9900);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      animation: girar-girasol 5s linear infinite;
    }

    .girasol::before {
      content: '';
      position: absolute;
      width: 40%;
      height: 40%;
      background-color: #8b4513;
      border-radius: 50%;
      top: 25%;
      left: 25%;
    }

    .girasol::after {
      content: '';
      position: absolute;
      width: 60%;
      height: 60%;
      background-color: #ffdf00;
      border-radius: 50%;
      top: 20%;
      left: 20%;
    }

    @keyframes girar-girasol {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

  </style>
</head>
<body>
  <audio id="musicaFlores" autoplay loop preload="auto">
    <source src="audio/flores-amarillas.m4a" type="audio/mp4">
  </audio>
  <div class="ramo">
    <!-- Ramo de rosas -->
    <div class="flor">
      <div class="rosa">
        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
      </div>
      <div class="tallo"></div>
    </div>
    <div class="flor">
      <div class="rosa">
        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
      </div>
      <div class="tallo"></div>
    </div>
    <div class="flor">
      <div class="rosa">
        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
      </div>
      <div class="tallo"></div>
    </div>
    <div class="flor">
      <div class="rosa">
        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
      </div>
      <div class="tallo"></div>
    </div>

    <!-- Ramo de girasoles -->
    <div class="flor">
      <div class="girasol"></div>
      <div class="tallo"></div>
    </div>
    <div class="flor">
      <div class="girasol"></div>
      <div class="tallo"></div>
    </div>
    <div class="flor">
      <div class="girasol"></div>
      <div class="tallo"></div>
    </div>
    <div class="flor">
      <div class="girasol"></div>
      <div class="tallo"></div>
    </div>
  </div>
  <script src="Js/musica.js"></script>
</body>
</html>
